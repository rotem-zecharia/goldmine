github_topics:
  - {topic: mcp-server, categories: [mcp]}
  - {topic: model-context-protocol, categories: [mcp]}
  - {topic: mcp, categories: [mcp]}
  - {topic: claude-code, categories: [claude-code]}
  - {topic: claude-code-plugin, categories: [plugin]}
  - {topic: claude-skills, categories: [skill]}
  - {topic: claude-plugin, categories: [plugin]}
  - {topic: agent-skills, categories: [skill]}
  - {topic: ai-agent-tools, categories: [agent]}
  - {topic: ai-agents, categories: [agent]}

# Verified reachable 2026-08-22. api.mcp.so returned 502 and is excluded.
registries:
  - name: mcp-official
    url: https://registry.modelcontextprotocol.io/v0/servers?limit=100
    style: cursor_token
  - name: smithery
    url: https://registry.smithery.ai/servers?page=1&pageSize=100
    style: page
  - name: glama
    url: https://glama.ai/api/mcp/v1/servers?first=100
    style: cursor

# Fallback tier: general open-source developer tools. The ecosystem topics
# above do not reach these - gallery-dl, instaloader, and firecrawl carry none
# of them - so without this section a query outside the Claude ecosystem finds
# nothing. Fewer pages each, because these topics are enormous and only the
# leaders matter.
oss_topics:
  - {topic: web-scraping, categories: [scraping]}
  - {topic: scraper, categories: [scraping]}
  - {topic: crawler, categories: [scraping]}
  - {topic: downloader, categories: [media-download]}
  - {topic: youtube-dl, categories: [media-download]}
  - {topic: instagram, categories: [media-download, scraping]}
  - {topic: instagram-scraper, categories: [scraping, media-download]}
  - {topic: video-processing, categories: [video]}
  - {topic: computer-vision, categories: [vision]}
  - {topic: speech-to-text, categories: [audio]}
  - {topic: ocr, categories: [image]}
  - {topic: browser-automation, categories: [browser]}
  - {topic: cli, categories: [productivity]}
  - {topic: developer-tools, categories: [productivity]}
  - {topic: automation, categories: [productivity]}
  - {topic: rag, categories: [docs]}
  - {topic: vector-database, categories: [docs]}
  - {topic: observability, categories: [devops]}
  - {topic: kubernetes, categories: [devops]}
  - {topic: testing, categories: [testing]}
  - {topic: security-tools, categories: [security]}
  - {topic: llm, categories: [agent]}

max_pages_per_topic: 10
max_pages_per_oss_topic: 3
registry_max_pages: 30
