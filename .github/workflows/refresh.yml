name: refresh catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests -q --ignore=tests/test_eval_catalog.py

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GITHUB_TOKEN in Actions allows ~1000 requests/hour and collection
        # alone spends most of that, so enrichment gets a small nightly budget
        # and the guard stops it before the crawl stalls on a reset.
        run: python -m goldmine.crawl --catalog-dir catalog --enrich-limit 120 --min-remaining 80

      # Runs before the commit, so a crawl that quietly breaks ranking fails the
      # run instead of publishing a worse catalog. The shrink guard in
      # catalog.py covers the other half: a partial crawl raises rather than
      # gutting the catalog.
      - name: Evaluate the new catalog
        run: python -m pytest tests/test_eval_catalog.py -q

      - name: Commit if anything changed
        run: |
          git config user.name "goldmine-bot"
          git config user.email "goldmine-bot@users.noreply.github.com"
          git add catalog
          git diff --staged --quiet || git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push
